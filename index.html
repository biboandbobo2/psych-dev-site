<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- LS-7: шрифты self-hosted (@fontsource-variable в main.tsx и лендингах),
         внешних хостов в критическом пути нет. Preconnect — к реальному
         критическому пути первой загрузки: auth → Firestore. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <title>DOM Academy</title>
  </head>
  <body>
    <!-- LS-6: статический сплеш виден с первого paint (до загрузки JS);
         createRoot().render() при старте React заменяет содержимое #root.
         Только инлайн-стили: CSS-бандл в этот момент ещё не загружен. -->
    <style>
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf7f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">
        <div style="text-align: center;">
          <div style="width: 56px; height: 56px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #2e7d32; color: #fff; font-size: 30px;">&Psi;</div>
          <div style="margin-top: 14px; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; color: #111827;">DOM Academy</div>
          <div style="margin: 20px auto 0; width: 26px; height: 26px; border: 3px solid #e7e2da; border-top-color: #2e7d32; border-radius: 50%; animation: splash-spin 0.8s linear infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
