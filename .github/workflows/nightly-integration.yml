name: Nightly Integration

on:
  schedule:
    # 02:30 UTC ежедневно (05:30 Тбилиси)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  integration:
    name: Firebase Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Эмуляторы Firestore/Auth — java-программы (docs/guides/testing-system.md).
      # Берём LTS, а не локальную версию разработчика.
      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --include=dev

      # firebase-tools в devDependencies; сервис-аккаунт не нужен —
      # rules-тесты идут через initializeTestEnvironment на эмуляторах.
      - name: Run integration tests against emulators
        run: npm run test:integration

      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-logs
          path: |
            firestore-debug.log
            firebase-debug.log
            ui-debug.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Telegram notification on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not configured, skipping notification"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔴 Nightly integration tests failed (psych-dev-site): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Telegram notification failed, see run logs"
