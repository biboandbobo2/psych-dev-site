<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>7–10 — шаг от 3–7, лист</title>
<style>
  @font-face { font-family: "DOMSans"; font-weight: 200 800; src: url("../assets/fonts/manrope-cyrillic-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "DOMSerif"; font-weight: 400 900; src: url("../assets/fonts/playfair-display-cyrillic-wght-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #F6F2E9; }
  .tag { font: 700 20px DOMSans, sans-serif; fill: #4B5563; letter-spacing: 0.08em; text-transform: uppercase; }
  .h1 { font: 500 46px DOMSerif, serif; fill: #1D2733; }
  .row { font: 700 19px DOMSans, sans-serif; fill: #1C7A71; letter-spacing: 0.08em; text-transform: uppercase; }
  .note { font: 500 21px DOMSans, sans-serif; fill: #5B6470; }
</style>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
'use strict';
// Лист «шаг от 3–7 к 7–10»: лицо — точная геометрия серии (lib.js addFace: глаза 38/62·45, r 4.6; рот M36 59 Q50 71 64 59),
// взгляд сдвигает лицо целиком. Шаги: брови (эмоции тоньше), руки-точки (действие), вещь-примета (личность), линия по линейке и глубина.
var NS = 'http://www.w3.org/2000/svg', S = document.getElementById('s');
function el(t, a, p) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); (p || S).appendChild(e); return e; }
function txt(x, y, cls, s, anchor) { var e = el('text', { x: x, y: y, class: cls, 'text-anchor': anchor || 'middle' }); e.textContent = s; return e; }
var INK = '#2B3440', GRAPH = '#5A5F66', CHILD = '#E4735A', ADULT = '#3E5A78', TEAL = '#26A69A', TEAL_D = '#1C7A71', PAPER = '#FFFDF8';
var MOUTH = { smile: 'M36 59 Q50 71 64 59', soft: 'M37 61 Q50 67 63 61', flat: 'M38 63 Q50 63 62 63', sad: 'M38 67 Q50 58 62 67', o: 'M45 63 Q50 70 55 63 Q50 58 45 63' };
var BROW = { calm: ['M30 33 Q38 29 46 32', 'M54 32 Q62 29 70 33'], focus: ['M31 32 Q38 31 45 34', 'M55 34 Q62 31 69 32'],
  doubt: ['M30 34 Q38 30 46 33', 'M54 29 Q62 26 70 30'], proud: ['M30 30 Q38 24 46 28', 'M54 28 Q62 24 70 30'], sad: ['M31 35 Q38 31 45 29', 'M55 29 Q62 31 69 35'] };

// Герой: круг — весь человек; лицо в коробке 0…100, как в движке серии
function hero(x, y, r, color, o) {
  o = o || {};
  var g = el('g', { transform: 'translate(' + (x - r) + ' ' + (y - r) + ') scale(' + (r / 50) + ')' });
  if (o.backpack) { el('rect', { x: -26, y: 30, width: 36, height: 50, rx: 10, fill: TEAL, stroke: TEAL_D, 'stroke-width': 3 }, g); el('rect', { x: -18, y: 52, width: 14, height: 9, rx: 3, fill: '#F5D27A', stroke: TEAL_D, 'stroke-width': 2 }, g); }
  el('circle', { cx: 50, cy: 50, r: 50, fill: color }, g);
  var f = el('g', { transform: 'translate(' + (o.gx || 0) + ' ' + (o.gy || 0) + ')' }, g); // взгляд — всё лицо целиком
  el('circle', { cx: 38, cy: 45, r: 4.6, fill: PAPER }, f);
  el('circle', { cx: 62, cy: 45, r: 4.6, fill: PAPER }, f);
  el('path', { d: MOUTH[o.mouth || 'smile'], fill: o.mouth === 'o' ? PAPER : 'none', stroke: PAPER, 'stroke-width': 4.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, f);
  if (o.glasses) { // очки v2: тонкие, линзы чуть больше глаз, ничего не налезает; брови — над линзами
    [38, 62].forEach(function (cx) { el('circle', { cx: cx, cy: 45, r: 8, fill: 'none', stroke: INK, 'stroke-width': 2 }, f); });
    el('path', { d: 'M46 44 Q50 41.5 54 44', fill: 'none', stroke: INK, 'stroke-width': 2 }, f);
  }
  if (o.brow) BROW[o.brow].forEach(function (d) { el('path', { d: d, fill: 'none', stroke: PAPER, 'stroke-width': 3.2, 'stroke-linecap': 'round', transform: o.glasses ? 'translate(0 -8)' : '' }, f); });
  if (o.bow) { el('path', { d: 'M66 7 l-15 -10 l0 20 Z M66 7 l15 -10 l0 20 Z', fill: TEAL }, g); el('circle', { cx: 66, cy: 7, r: 5, fill: TEAL_D }, g); }
  if (o.hands) o.hands.forEach(function (h) { el('circle', { cx: h[0], cy: h[1], r: 12, fill: color }, g); });
  if (o.pencil) el('path', { d: o.pencil, stroke: '#8B6A45', 'stroke-width': 5, 'stroke-linecap': 'round' }, g);
  return g;
}
function line(d, w, c) { return el('path', { d: d, fill: 'none', stroke: c || INK, 'stroke-width': w || 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); }
function arrow(x1, x2, y) { line('M' + x1 + ' ' + y + ' H' + x2 + ' M' + (x2 - 12) + ' ' + (y - 9) + ' L' + x2 + ' ' + y + ' L' + (x2 - 12) + ' ' + (y + 9), 2.6, '#9AA1A6'); }


el('rect', { x: 0, y: 0, width: 1920, height: 1080, fill: '#F6F2E9' });
txt(140, 100, 'h1', 'Язык 7–10: что ещё развить', 'start');

// 0 · очки: было → стало
txt(140, 170, 'row', 'очки Димы', 'start');
var oldG = el('g', { transform: 'translate(200 200) scale(1.1)' });
el('circle', { cx: 50, cy: 50, r: 50, fill: CHILD }, oldG);
[38, 62].forEach(function (cx) { el('circle', { cx: cx, cy: 45, r: 4.6, fill: PAPER }, oldG); el('circle', { cx: cx, cy: 45, r: 9, fill: 'none', stroke: INK, 'stroke-width': 2.6 }, oldG); });
el('path', { d: 'M47 45 H53', stroke: INK, 'stroke-width': 2.6 }, oldG);
['M30 33 Q38 29 46 32', 'M54 32 Q62 29 70 33'].forEach(function (d) { el('path', { d: d, fill: 'none', stroke: PAPER, 'stroke-width': 3.2, 'stroke-linecap': 'round' }, oldG); });
el('path', { d: MOUTH.smile, fill: 'none', stroke: PAPER, 'stroke-width': 4.2, 'stroke-linecap': 'round' }, oldG);
txt(255, 350, 'note', 'было');
arrow(330, 390, 255);
hero(470, 255, 60, CHILD, { glasses: true, brow: 'calm' }); txt(470, 350, 'note', 'стало');
hero(620, 255, 60, CHILD, { glasses: true, brow: 'focus', mouth: 'flat' }); txt(620, 350, 'note', 'сосредоточен');

// 1 · мысль — схемой (внутренний план): в 3–7 облако с рисунком, в 7–10 — с ровной схемой
txt(800, 170, 'row', '1 · мысль — схемой', 'start');
function cloud(cx, cy, rx, ry, tail) {
  var d = '', N = 60; for (var i = 0; i <= N; i++) { var a = 2 * Math.PI * i / N, r = 1 + 0.1 * Math.abs(Math.sin(5 * a)); d += (i ? 'L' : 'M') + (cx + rx * r * Math.cos(a)).toFixed(1) + ' ' + (cy + ry * r * Math.sin(a)).toFixed(1); }
  el('path', { d: d + 'Z', fill: PAPER, stroke: INK, 'stroke-width': 2.4 });
  el('circle', { cx: tail[0], cy: tail[1], r: 8, fill: PAPER, stroke: INK, 'stroke-width': 2.4 }); el('circle', { cx: tail[2], cy: tail[3], r: 5, fill: PAPER, stroke: INK, 'stroke-width': 2.4 });
}
// 3–7: облако с рисованной лошадкой (графит)
hero(880, 350, 40, CHILD, { gx: 2, gy: -3 });
cloud(930, 250, 80, 46, [905, 305, 893, 318]);
line('M895 262 L940 262 L952 236 L966 232 L962 246 L952 250 L946 262 M902 262 L898 282 M940 262 L944 282 M895 262 Q884 252 888 240', 2.6, GRAPH); line('M954 236 L950 226', 2.6, GRAPH);
txt(930, 418, 'note', '3–7: воображает');
arrow(1010, 1060, 280);
// 7–10: облако со схемой «мерка → 3 раза → число»
hero(1150, 350, 44, CHILD, { brow: 'focus', mouth: 'flat', gx: 3, gy: -3, backpack: true });
cloud(1250, 245, 150, 56, [1195, 308, 1180, 322]);
line('M1140 232 H1360', 2.6, TEAL_D); [1140, 1213, 1286, 1360].forEach(function (x) { line('M' + x + ' 224 V240', 2.6, TEAL_D); });
var t3 = el('text', { x: 1250, y: 278, 'text-anchor': 'middle', style: 'font: 24px DOMSans; fill: #1C7A71' }); t3.textContent = '| | |  → 3';
txt(1250, 418, 'note', '7–10: планирует схемой');

// 2 · линии отношений: кто с кем
txt(140, 470, 'row', '2 · линии отношений', 'start');
var K = [[240, 640, CHILD, { backpack: true, brow: 'calm' }], [380, 600, CHILD, { bow: true, brow: 'calm' }], [520, 650, '#EC8A6F', { brow: 'calm' }], [400, 760, '#F09A7E', { brow: 'calm' }], [700, 740, CHILD, { glasses: true, brow: 'sad', mouth: 'soft', gx: -3 }]];
line('M240 640 L380 600', 3.4, TEAL_D); line('M380 600 L520 650', 3.4, TEAL_D); line('M240 640 L400 760', 2.4, '#9AA1A6').setAttribute('stroke-dasharray', '6 8');
K.forEach(function (k) { hero(k[0], k[1], 40, k[2], k[3]); });
txt(450, 830, 'note', 'дружат — линия, знакомы — пунктир, у стены — ни одной');

// 3 · движение по правилам: подготовка → действие → удержание
txt(900, 470, 'row', '3 · движение по правилам', 'start');
hero(960, 690, 46, CHILD, { brow: 'focus', mouth: 'flat' }); el('ellipse', { cx: 960, cy: 742, rx: 40, ry: 5, fill: '#E3DACB' });
txt(960, 790, 'note', 'присел');
var sq = S.lastChild.previousSibling.previousSibling; // визуально: подготовка — круг чуть сплющен
arrow(1040, 1080, 680);
hero(1150, 660, 46, CHILD, { brow: 'proud', hands: [[90, 4]] }); txt(1140, 790, 'note', 'поднял руку');
arrow(1210, 1250, 680);
hero(1340, 660, 46, CHILD, { brow: 'calm', hands: [[90, 4]] }); txt(1340, 790, 'note', 'ждёт очереди');
line('M1250 700 H1390', 1.6, '#C9BBA2'); [1250, 1285, 1320, 1355, 1390].forEach(function (x) { line('M' + x + ' 700 V708', 1.6, '#C9BBA2'); });

// 4 · жест вместо реплики: класс тянет руки
txt(1480, 470, 'row', '4 · жест вместо реплики', 'start');
[[1540, 690, '#EC8A6F', false], [1630, 690, CHILD, true], [1720, 690, '#F09A7E', true], [1810, 690, '#E58468', false]].forEach(function (k, i) {
  hero(k[0], k[1], 34, k[2], k[3] ? { hands: [[90, 4]], brow: 'proud', bow: i === 2 } : { brow: 'calm' });
});
txt(1680, 790, 'note', '«я знаю!» — без слов');

txt(140, 960, 'note', 'Всё на том же языке серии: круг — весь человек, лицо из точек, тонкая линия. Новое — только то, что появляется у ребёнка 7–10:', 'start');
txt(140, 994, 'note', 'брови (оттенки чувств), руки-точки (действие), своя вещь (личность), мысль-схема (внутренний план), линии отношений (группа сверстников),', 'start');
txt(140, 1028, 'note', 'точное движение с подготовкой (произвольность), глубина «как вижу».', 'start');
</script>
</body>
</html>
